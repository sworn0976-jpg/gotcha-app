<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gotcha</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
</head>
<body>

  <h1>Gotcha 📸</h1>
  <p>Bienvenue dans ton Pokédex animal !</p>

  <button id="btnCamera">Ouvrir la caméra</button>
  <button id="btnSwitch">🔄 Changer de caméra</button>

  <div>
    <video id="video" autoplay playsinline width="300"></video>
  </div>

  <button id="btnPhoto">📷 Prendre la photo</button>

  <canvas id="canvas" width="300" height="300" style="border: 2px solid black;"></canvas>

  <button id="btnAnalyser">🔍 Identifier cet animal</button>

  <div id="fiche" style="border: 2px solid green; padding: 10px; margin-top: 10px; display: none;">
    <h2 id="ficheNom">Nom de l'espèce</h2>
    <p id="ficheStatut">En attente d'analyse...</p>
  </div>

  <script>
    const btnCamera = document.getElementById('btnCamera');
    const btnSwitch = document.getElementById('btnSwitch');
    const btnPhoto = document.getElementById('btnPhoto');
    const btnAnalyser = document.getElementById('btnAnalyser');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const fiche = document.getElementById('fiche');
    const ficheNom = document.getElementById('ficheNom');
    const ficheStatut = document.getElementById('ficheStatut');

    // 'environment' = caméra arrière (par défaut, pratique pour photographier des animaux)
    // 'user' = caméra avant (selfie)
    let facingMode = 'environment';
    let currentStream = null;

    async function demarrerCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        // "exact" force vraiment le changement de caméra (certains téléphones ignorent le mode simple)
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: facingMode } }
        });
      } catch (err) {
        // Si le téléphone n'a pas cette caméra précise en "exact", on retente en mode "souhaité" plutôt qu'obligatoire
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode }
        });
      }
      video.srcObject = currentStream;
    }

    btnCamera.addEventListener('click', demarrerCamera);

    btnSwitch.addEventListener('click', () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      demarrerCamera();
    });

    btnPhoto.addEventListener('click', () => {
      const context = canvas.getContext('2d');
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
    });

    // On charge le modèle de reconnaissance dès l'ouverture de la page (ça prend 2-5 secondes)
    let modele = null;
    ficheStatut.textContent = '';
    async function chargerModele() {
      modele = await mobilenet.load();
      console.log('Modèle chargé et prêt');
    }
    chargerModele();

    btnAnalyser.addEventListener('click', async () => {
      fiche.style.display = 'block';

      if (!modele) {
        ficheNom.textContent = '...';
        ficheStatut.textContent = 'Le modèle charge encore, réessaie dans 2 secondes.';
        return;
      }

      ficheNom.textContent = '...';
      ficheStatut.textContent = 'Analyse en cours...';

      const predictions = await modele.classify(canvas);

      if (predictions && predictions.length > 0) {
        ficheNom.textContent = predictions[0].className;
        const confiance = Math.round(predictions[0].probability * 100);
        const autres = predictions.slice(1, 3)
          .map(p => p.className)
          .join(', ');
        ficheStatut.textContent = `Confiance : ${confiance}% — Autres possibilités : ${autres}`;
      } else {
        ficheNom.textContent = 'Non identifié';
        ficheStatut.textContent = 'Essaie une autre photo, plus nette ou plus proche.';
      }
    });
  </script>

</body>
</html>
